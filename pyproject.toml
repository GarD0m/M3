[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopmoe"
version = "0.1.0"
description = "1B 1-Layer DeepSeek-V4.1-Flash LoopMoE for local 64K tokenizer and high-MFU TPU v6e-1 training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "jax>=0.5.0",
    "flax>=0.10.0",
    "optax>=0.2.5",
    "tokenizers>=0.20.0",
    "datasets>=3.0.0",
    "huggingface_hub>=0.26.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
tpu = ["tokamax"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
